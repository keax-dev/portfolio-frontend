server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location = /index.html {
        expires -1;
    }

    location ~ ^/(login|home)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|woff|ttf|eot|map)$ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|mp4|webm)$ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
