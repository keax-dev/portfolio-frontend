<a class="skip-link" href="#portfolio-main">Skip to content</a>
<div class="portfolio-experience">
  <div class="portfolio-progress" aria-hidden="true"></div>

  <app-header class="portfolio-hero" [profile]="profile()"></app-header>
  <app-navbar
    class="portfolio-navigation"
    [navItems]="navItems"
    [profile]="profile()"
    (contact)="modalContact()"
  ></app-navbar>

  <main class="portfolio-main" id="portfolio-main">
    <div class="portfolio-orb portfolio-orb--one" aria-hidden="true"></div>
    <div class="portfolio-orb portfolio-orb--two" aria-hidden="true"></div>

    <app-education
      appRevealOnScroll
      class="portfolio-section portfolio-section--left"
      [educationList]="educationList()"
    ></app-education>
    <app-skill
      appRevealOnScroll
      class="portfolio-section portfolio-section--right"
      [skillList]="skillList()"
    ></app-skill>
    <app-project
      appRevealOnScroll
      class="portfolio-section portfolio-section--center"
      [projectList]="projectList()"
    ></app-project>
  </main>

  <app-footer
    appRevealOnScroll
    class="portfolio-footer"
    (contact)="modalContact()"
    [socialNetworkList]="socialNetworkList()"
    [navItems]="navItems"
  ></app-footer>
</div>
