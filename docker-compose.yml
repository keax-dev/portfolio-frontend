services:
  frontend:
    container_name: portfolio-frontend
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-frontend:local
    ports:
      - '8080:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
